apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: platform

  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: YOUR_PINNED_CHART_VERSION
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/platform/aws-load-balancer-controller/values.yaml

    - repoURL: https://github.com/YOUR_ORG/enterprise-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true