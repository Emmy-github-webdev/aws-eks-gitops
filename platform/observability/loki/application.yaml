apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: alloy
  namespace: argocd

spec:
  project: platform

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: PINNED_ALLOY_CHART_VERSION

      helm:
        releaseName: alloy

        valueFiles:
          - $values/platform/observability/alloy/values.yaml

    - repoURL: https://github.com/YOUR_ORG/enterprise-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: true