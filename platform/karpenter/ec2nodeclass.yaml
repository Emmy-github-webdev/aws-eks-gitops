apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: production
spec:
  role: KarpenterNodeRole-enterprise-production

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: enterprise-production

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: enterprise-production

  amiSelectorTerms:
    - alias: al2023@latest

  amiFamily: AL2023

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Environment: production
    ManagedBy: Karpenter