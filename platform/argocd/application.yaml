apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: platform

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: YOUR_PINNED_CHART_VERSION

    helm:
      releaseName: argocd
      valueFiles: []

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false