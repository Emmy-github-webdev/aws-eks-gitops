apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-api
  namespace: argocd
spec:
  project: applications

  source:
    repoURL: https://github.com/YOUR_ORG/enterprise-gitops.git
    targetRevision: main
    path: applications/my-api

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      selfHeal: true
      prune: true

    syncOptions:
      - CreateNamespace=false
      - PruneLast=true