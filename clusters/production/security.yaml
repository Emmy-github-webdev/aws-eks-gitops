apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-policies
  namespace: argocd
spec:
  project: security

  source:
    repoURL: https://github.com/YOUR_ORG/enterprise-gitops.git
    targetRevision: main
    path: security/kyverno-policies

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      selfHeal: true
      prune: true