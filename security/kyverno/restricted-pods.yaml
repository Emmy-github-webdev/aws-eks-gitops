apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-restricted-security
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod

      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - external-secrets

      validate:
        message: "Containers must run as non-root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: require-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod

      validate:
        message: "Pods must use RuntimeDefault seccomp."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault