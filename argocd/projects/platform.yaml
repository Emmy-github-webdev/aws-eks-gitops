apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Enterprise platform components

  sourceRepos:
    - https://github.com/YOUR_ORG/enterprise-gitops.git
    - https://aws.github.io/eks-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: platform-admin
      description: Platform administration
      groups:
        - platform-admins
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow