apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
spec:
  description: Root GitOps application management

  sourceRepos:
    - https://github.com/YOUR_ORG/enterprise-gitops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd

  clusterResourceWhitelist: []

  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application