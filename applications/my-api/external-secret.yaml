apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-api-secrets
  namespace: production
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets
    kind: SecretStore

  target:
    name: my-api-secrets
    creationPolicy: Owner

  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: production/my-api
        property: DATABASE_URL

    - secretKey: API_KEY
      remoteRef:
        key: production/my-api
        property: API_KEY