apiVersion: v1
kind: Secret

metadata:
  name: alertmanager-config
  namespace: monitoring

type: Opaque

stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default

      group_by:
        - alertname
        - cluster
        - namespace

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - matchers:
            - severity="critical"

          receiver: pagerduty

          continue: false

        - matchers:
            - severity="warning"

          receiver: default

    receivers:
      - name: default

      - name: pagerduty
        pagerduty_configs:
          - routing_key: YOUR_PAGERDUTY_INTEGRATION_KEY
            send_resolved: true